<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Transferências - WRA Veículos</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & React DOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel standalone para JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons (Vanilla only to prevent React script bundle namespace conflicts) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">
    <div id="root"></div>

    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDocs, onSnapshot, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Configuração e inicialização do Firebase com fallbacks para execução imediata
        const firebaseConfig = window.__firebase_config ? JSON.parse(window.__firebase_config) : {
            apiKey: "AIzaSyDemoKeyOnlyForAppStructureHere",
            authDomain: "wra-veiculos.firebaseapp.com",
            projectId: "wra-veiculos",
            storageBucket: "wra-veiculos.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abcdef123456"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        let db;
        try {
            db = getFirestore(app);
        } catch (err) {
            console.warn("Aviso ao conectar com Firestore:", err.message);
            db = getFirestore(app);
        }

        // Expor instâncias para o React em window
        window.firebaseServices = { auth, db, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged, collection, doc, setDoc, getDocs, onSnapshot, deleteDoc, updateDoc };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // ID dinâmico da aplicação para regras do Firestore
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'wra-veiculos-crm';

        // Definição das etapas dinâmicas por fase
        const CHECKLIST_STEPS = {
            Entrada: [
                { id: 'vistoria', label: '1. Vistoria' },
                { id: 'atpv', label: '2. ATPV' },
                { id: 'autocerto', label: '3. AUTOCERTO' },
                { id: 'notaFiscal', label: '4. NOTA FISCAL de entrada' },
                { id: 'controlStock', label: '5. Control stock' },
                { id: 'lubeDespachante', label: '6. Lube despachante' },
                { id: 'lubeTaxa', label: '7. Lube taxa' },
                { id: 'detran', label: '8. DETRAN' },
                { id: 'docPronto', label: '9. Doc pronto (Etapa Final)' }
            ],
            Saida: [
                { id: 'vistoria', label: '1. Vistoria' },
                { id: 'atpv', label: '2. ATPV' },
                { id: 'autocerto', label: '3. AUTOCERTO' },
                { id: 'notaFiscal', label: '4. NOTA FISCAL de saída' },
                { id: 'controlStock', label: '5. Control stock' },
                { id: 'lubeDespachante', label: '6. Lube despachante' },
                { id: 'lubeTaxa', label: '7. Lube taxa' },
                { id: 'detran', label: '8. DETRAN' },
                { id: 'docPronto', label: '9. Doc pronto (Etapa Final)' }
            ]
        };

        const createInitialChecklist = (tipo = 'Entrada') => {
            const steps = CHECKLIST_STEPS[tipo] || CHECKLIST_STEPS.Entrada;
            const obj = {};
            steps.forEach(step => {
                obj[step.id] = { checked: false, data: '' };
            });
            return obj;
        };

        // --- COMPONENTE DE LOGIN & GESTÃO DE USUÁRIOS ---
        function LoginScreen({ onLoginSuccess }) {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [isRegistering, setIsRegistering] = useState(false);
            const [role, setRole] = useState('atendente');
            const [error, setError] = useState('');

            const handleAuth = async (e) => {
                e.preventDefault();
                setError('');
                const { auth, signInWithEmailAndPassword, createUserWithEmailAndPassword } = window.firebaseServices;

                try {
                    if (isRegistering) {
                        const userCred = await createUserWithEmailAndPassword(auth, email, password);
                        onLoginSuccess(userCred.user, role);
                    } else {
                        const userCred = await signInWithEmailAndPassword(auth, email, password);
                        onLoginSuccess(userCred.user, 'admin');
                    }
                } catch (err) {
                    setError('Falha na autenticação: ' + err.message);
                }
            };

            return (
                <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl p-8 max-w-md w-full shadow-2xl border border-slate-800">
                        <div className="text-center mb-6">
                            <div className="inline-block bg-red-600 text-white text-2xl font-black px-4 py-1.5 rounded-xl mb-2">WRA</div>
                            <h2 className="text-xl font-bold text-slate-800">CRM Transferências</h2>
                            <p className="text-xs text-slate-500 mt-1">Acesse sua conta para gerenciar os processos</p>
                        </div>

                        {error && (
                            <div className="bg-red-50 text-red-600 p-3 rounded-lg text-xs mb-4 font-medium border border-red-200">
                                {error}
                            </div>
                        )}

                        <form onSubmit={handleAuth} className="space-y-4">
                            <div>
                                <label className="block text-xs font-semibold text-slate-600 mb-1">E-mail Corporativo</label>
                                <input
                                    type="email"
                                    required
                                    placeholder="usuario@wraveiculos.com.br"
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                    className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-red-500 focus:outline-none"
                                />
                            </div>

                            <div>
                                <label className="block text-xs font-semibold text-slate-600 mb-1">Senha</label>
                                <input
                                    type="password"
                                    required
                                    placeholder="••••••••"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-red-500 focus:outline-none"
                                />
                            </div>

                            {isRegistering && (
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1">Perfil do Funcionário</label>
                                    <select
                                        value={role}
                                        onChange={(e) => setRole(e.target.value)}
                                        className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-red-500 focus:outline-none"
                                    >
                                        <option value="atendente">Atendente (Lojas VV / Cariacica)</option>
                                        <option value="despachante">Despachante / Operacional</option>
                                        <option value="admin">Administrador Geral</option>
                                    </select>
                                </div>
                            )}

                            <button
                                type="submit"
                                className="w-full py-2.5 bg-red-600 hover:bg-red-700 text-white font-bold text-sm rounded-lg transition shadow-md"
                            >
                                {isRegistering ? 'Criar Nova Conta' : 'Entrar no Sistema'}
                            </button>
                        </form>

                        <div className="mt-6 text-center border-t border-slate-100 pt-4">
                            <button
                                type="button"
                                onClick={() => setIsRegistering(!isRegistering)}
                                className="text-xs font-semibold text-red-600 hover:text-red-700 transition"
                            >
                                {isRegistering ? 'Já possui conta? Faça login' : 'Novo colaborador? Cadastrar novo usuário'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // Componente Principal
        function App() {
            const [currentUser, setCurrentUser] = useState(null);
            const [userRole, setUserRole] = useState('admin');

            // Estado Principal
            const [vehicles, setVehicles] = useState([]);
            const [loading, setLoading] = useState(true);
            const [searchTerm, setSearchTerm] = useState('');
            const [filterLoja, setFilterLoja] = useState('Todas');
            const [filterStatus, setFilterStatus] = useState('Todos');
            const [filterTipo, setFilterTipo] = useState('Todos');

            // Modais
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [selectedVehicle, setSelectedVehicle] = useState(null);
            const [activeTab, setActiveTab] = useState('detalhes');

            // Notificações Toast
            const [toast, setToast] = useState(null);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3500);
            };

            // Escutar status de autenticação Firebase
            useEffect(() => {
                const interval = setInterval(() => {
                    if (window.firebaseServices && window.firebaseServices.onAuthStateChanged) {
                        clearInterval(interval);
                        const { auth, onAuthStateChanged } = window.firebaseServices;
                        onAuthStateChanged(auth, (user) => {
                            setCurrentUser(user);
                        });
                    }
                }, 200);
                return () => clearInterval(interval);
            }, []);

            // Escuta em tempo real da coleção do Firestore
            useEffect(() => {
                if (!currentUser || !window.firebaseServices) return;

                const { db, collection, onSnapshot } = window.firebaseServices;
                // Caminho estrito de dados públicos
                const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'transferencias');

                setLoading(true);
                const unsubscribe = onSnapshot(colRef, (snapshot) => {
                    const loadedVehicles = snapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    }));
                    setVehicles(loadedVehicles);
                    setLoading(false);
                }, (error) => {
                    console.error("Erro ao sincronizar Firestore:", error);
                    setLoading(false);
                });

                return () => unsubscribe();
            }, [currentUser]);

            // Se não autenticado, abre tela de login
            if (!currentUser) {
                return <LoginScreen onLoginSuccess={(user, role) => { setCurrentUser(user); setUserRole(role); }} />;
            }

            // Exportação CSV de relatórios
            const handleExportCSV = () => {
                if (filteredVehicles.length === 0) {
                    showToast('Nenhum registro para exportar.', 'warning');
                    return;
                }

                const headers = ["ID", "Placa", "Modelo", "Ano", "Cliente", "CPF_CNPJ", "Telefone", "Loja", "Tipo", "Status", "Data_Inicio", "Observacoes"];
                const rows = filteredVehicles.map(v => [
                    v.id,
                    v.placa,
                    `"${(v.modelo || '').replace(/"/g, '""')}"`,
                    v.ano || '',
                    `"${(v.cliente || '').replace(/"/g, '""')}"`,
                    v.cpfCnpj || '',
                    v.telefone || '',
                    v.loja || '',
                    v.tipo || '',
                    v.status || '',
                    v.dataInicio || '',
                    `"${(v.observacoes || '').replace(/"/g, '""')}"`
                ]);

                const csvContent = "data:text/csv;charset=utf-8,\uFEFF" 
                    + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");

                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `Relatorio_Transferencias_WRA_${new Date().toISOString().slice(0,10)}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast('Relatório CSV exportado com sucesso!');
            };

            // Filtragem de dados
            const filteredVehicles = useMemo(() => {
                return vehicles.filter(v => {
                    const matchSearch = 
                        (v.placa || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                        (v.modelo || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                        (v.cliente || '').toLowerCase().includes(searchTerm.toLowerCase());
                    const matchLoja = filterLoja === 'Todas' || v.loja === filterLoja;
                    const matchStatus = filterStatus === 'Todos' || v.status === filterStatus;
                    const matchTipo = filterTipo === 'Todos' || v.tipo === filterTipo;

                    return matchSearch && matchLoja && matchStatus && matchTipo;
                });
            }, [vehicles, searchTerm, filterLoja, filterStatus, filterTipo]);

            // Métricas
            const stats = useMemo(() => {
                return {
                    total: vehicles.length,
                    emAndamento: vehicles.filter(v => v.status === 'Em Andamento').length,
                    concluidos: vehicles.filter(v => v.status === 'Concluído').length,
                    pendentes: vehicles.filter(v => v.status === 'Pendente').length,
                    vilaVelha: vehicles.filter(v => v.loja === 'Vila Velha').length,
                    cariacica: vehicles.filter(v => v.loja === 'Cariacica').length,
                };
            }, [vehicles]);

            // Salvar / Atualizar Veículo no Firestore
            const handleSaveVehicle = async (vehicleData) => {
                const { db, doc, setDoc } = window.firebaseServices;
                
                try {
                    const docId = vehicleData.id || `wra-${Date.now().toString().slice(-6)}`;
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'transferencias', docId);

                    const dataToSave = {
                        ...vehicleData,
                        id: docId,
                        updatedAt: new Date().toISOString(),
                        updatedBy: currentUser.email
                    };

                    await setDoc(docRef, dataToSave, { merge: true });
                    showToast('Processo salvo no banco de dados com sucesso!');
                    setIsModalOpen(false);
                    setSelectedVehicle(null);
                } catch (err) {
                    console.error("Erro ao salvar no Firestore:", err);
                    showToast('Erro ao salvar processo: ' + err.message, 'danger');
                }
            };

            // Excluir Veículo do Firestore
            const handleDeleteVehicle = async (id) => {
                if (!window.confirm('Tem certeza que deseja excluir permanentemente este processo?')) return;

                const { db, doc, deleteDoc } = window.firebaseServices;
                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'transferencias', id);
                    await deleteDoc(docRef);
                    showToast('Processo removido com sucesso.', 'danger');
                    setIsModalOpen(false);
                } catch (err) {
                    console.error("Erro ao excluir do Firestore:", err);
                    showToast('Erro ao remover processo: ' + err.message, 'danger');
                }
            };

            // Logout
            const handleLogout = () => {
                const { auth, signOut } = window.firebaseServices;
                signOut(auth);
                setCurrentUser(null);
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Header Topo */}
                    <header className="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-30 shadow-md">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                                <div className="bg-red-600 text-white font-black text-xl px-3 py-1 rounded-lg tracking-wider">
                                    WRA
                                </div>
                                <div>
                                    <h1 className="font-bold text-lg leading-tight">CRM Transferências</h1>
                                    <p className="text-xs text-slate-400">Usuário: {currentUser.email}</p>
                                </div>
                            </div>

                            {/* Botões de Ação Global */}
                            <div className="flex items-center space-x-2">
                                <button
                                    onClick={handleExportCSV}
                                    className="inline-flex items-center px-3 py-2 bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold rounded-lg shadow-sm transition border border-slate-700"
                                    title="Exportar Lista Atual em CSV"
                                >
                                    <i data-lucide="download" className="w-4 h-4 mr-1.5"></i> Exportar CSV
                                </button>

                                <button
                                    onClick={() => {
                                        setSelectedVehicle(null);
                                        setActiveTab('detalhes');
                                        setIsModalOpen(true);
                                    }}
                                    className="inline-flex items-center px-4 py-2 bg-red-600 hover:bg-red-700 text-white text-sm font-semibold rounded-lg shadow-sm transition"
                                >
                                    <i data-lucide="plus" className="w-4 h-4 mr-1.5"></i> Novo Processo
                                </button>

                                <button 
                                    onClick={handleLogout}
                                    className="p-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition"
                                    title="Sair do Sistema"
                                >
                                    <i data-lucide="log-out" className="w-5 h-5"></i>
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Conteúdo Principal */}
                    <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
                        {/* Toast Alert */}
                        {toast && (
                            <div className={`fixed bottom-5 right-5 z-50 px-4 py-3 rounded-lg shadow-lg text-white font-medium flex items-center space-x-2 transition-all ${
                                toast.type === 'danger' ? 'bg-red-600' : toast.type === 'warning' ? 'bg-amber-500' : 'bg-emerald-600'
                            }`}>
                                <i data-lucide={toast.type === 'danger' ? 'alert-circle' : 'check-circle'} className="w-5 h-5"></i>
                                <span>{toast.message}</span>
                            </div>
                        )}

                        {/* Cards de Métricas */}
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                                <div>
                                    <p className="text-xs font-medium text-slate-500">Total de Processos</p>
                                    <p className="text-2xl font-bold text-slate-800 mt-1">{stats.total}</p>
                                </div>
                                <div className="p-3 bg-blue-50 text-blue-600 rounded-lg">
                                    <i data-lucide="car" className="w-6 h-6"></i>
                                </div>
                            </div>

                            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                                <div>
                                    <p className="text-xs font-medium text-slate-500">Em Andamento</p>
                                    <p className="text-2xl font-bold text-amber-600 mt-1">{stats.emAndamento}</p>
                                </div>
                                <div className="p-3 bg-amber-50 text-amber-600 rounded-lg">
                                    <i data-lucide="clock" className="w-6 h-6"></i>
                                </div>
                            </div>

                            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                                <div>
                                    <p className="text-xs font-medium text-slate-500">Concluídos</p>
                                    <p className="text-2xl font-bold text-emerald-600 mt-1">{stats.concluidos}</p>
                                </div>
                                <div className="p-3 bg-emerald-50 text-emerald-600 rounded-lg">
                                    <i data-lucide="check-circle" className="w-6 h-6"></i>
                                </div>
                            </div>

                            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                                <div>
                                    <p className="text-xs font-medium text-slate-500">Lojas (VV / Cariacica)</p>
                                    <p className="text-xl font-bold text-slate-800 mt-1">{stats.vilaVelha} / {stats.cariacica}</p>
                                </div>
                                <div className="p-3 bg-purple-50 text-purple-600 rounded-lg">
                                    <i data-lucide="map-pin" className="w-6 h-6"></i>
                                </div>
                            </div>
                        </div>

                        {/* Barra de Filtros e Busca */}
                        <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col md:flex-row items-center justify-between gap-4">
                            <div className="relative w-full md:w-80">
                                <i data-lucide="search" className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                <input
                                    type="text"
                                    placeholder="Buscar placa, veículo ou cliente..."
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    className="w-full pl-9 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent"
                                />
                            </div>

                            <div className="flex flex-wrap items-center gap-3 w-full md:w-auto">
                                <div className="flex items-center space-x-2">
                                    <span className="text-xs font-medium text-slate-500">Loja:</span>
                                    <select
                                        value={filterLoja}
                                        onChange={(e) => setFilterLoja(e.target.value)}
                                        className="border border-slate-300 rounded-lg px-3 py-1.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-red-500"
                                    >
                                        <option value="Todas">Todas as Lojas</option>
                                        <option value="Vila Velha">Vila Velha</option>
                                        <option value="Cariacica">Cariacica</option>
                                    </select>
                                </div>

                                <div className="flex items-center space-x-2">
                                    <span className="text-xs font-medium text-slate-500">Status:</span>
                                    <select
                                        value={filterStatus}
                                        onChange={(e) => setFilterStatus(e.target.value)}
                                        className="border border-slate-300 rounded-lg px-3 py-1.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-red-500"
                                    >
                                        <option value="Todos">Todos os Status</option>
                                        <option value="Pendente">Pendente</option>
                                        <option value="Em Andamento">Em Andamento</option>
                                        <option value="Concluído">Concluído</option>
                                    </select>
                                </div>

                                <div className="flex items-center space-x-2">
                                    <span className="text-xs font-medium text-slate-500">Fase:</span>
                                    <select
                                        value={filterTipo}
                                        onChange={(e) => setFilterTipo(e.target.value)}
                                        className="border border-slate-300 rounded-lg px-3 py-1.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-red-500"
                                    >
                                        <option value="Todos">Todas as Fases</option>
                                        <option value="Entrada">Entrada (Compra)</option>
                                        <option value="Saida">Saída (Venda)</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        {/* Tabela de Processos */}
                        <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-sm text-slate-600">
                                    <thead className="bg-slate-50 text-slate-700 font-semibold border-b border-slate-200">
                                        <tr>
                                            <th className="px-4 py-3">Placa / Veículo</th>
                                            <th className="px-4 py-3">Cliente / Contato</th>
                                            <th className="px-4 py-3">Loja</th>
                                            <th className="px-4 py-3">Fase</th>
                                            <th className="px-4 py-3">Progresso Checklist</th>
                                            <th className="px-4 py-3">Status</th>

                                                        <div className="w-4 h-4 border-2 border-red-600 border-t-transparent rounded-full animate-spin"></div>

                                            <tr>

                                        ) : (
                                            filteredVehicles.map((v) => {
                                                const stepsList = CHECKLIST_STEPS[v.tipo] || CHECKLIST_STEPS.Entrada;
                                                const totalItems = stepsList.length;
                                                const checkedItems = stepsList.filter(s => v.checklist && v.checklist[s.id] && v.checklist[s.id].checked).length;
                                                const progressPercent = Math.round((checkedItems / totalItems) * 100);

                                                return (
                                                    <tr key={v.id} className="hover:bg-slate-50/80 transition">
                                                        <td className="px-4 py-3">
                                                            <div className="font-bold text-slate-900 flex items-center space-x-2">
                                                                <span className="bg-slate-800 text-white font-mono px-2 py-0.5 rounded text-xs tracking-wider">{v.placa}</span>
                                                            </div>
                                                            <div className="text-xs text-slate-500 mt-0.5">{v.modelo} ({v.ano})</div>
                                                        </td>
                                                        <td className="px-4 py-3">
                                                            <div className="font-medium text-slate-800">{v.cliente}</div>
                                                            <div className="text-xs text-slate-500">{v.telefone}</div>
                                                        </td>
                                                        <td className="px-4 py-3">
                                                            <span className="inline-flex items-center px-2 py-1 rounded-md text-xs font-medium bg-slate-100 text-slate-700">
                                                                <i data-lucide="map-pin" className="w-3 h-3 mr-1 text-slate-400"></i>
                                                                {v.loja}
                                                            </span>
                                                        </td>
                                                        <td className="px-4 py-3">
                                                            <span className={`inline-flex items-center px-2 py-1 rounded-md text-xs font-medium ${
                                                                v.tipo === 'Entrada' ? 'bg-blue-50 text-blue-700' : 'bg-purple-50 text-purple-700'
                                                            }`}>
                                                                {v.tipo === 'Entrada' ? '📥 Entrada' : '📤 Saída'}
                                                            </span>
                                                        </td>
                                                        <td className="px-4 py-3">
                                                            <div className="w-36">
                                                                <div className="flex justify-between text-xs mb-1 font-medium text-slate-600">
                                                                    <span>{checkedItems}/{totalItems} etapas</span>
                                                                    <span>{progressPercent}%</span>
                                                                </div>
                                                                <div className="w-full bg-slate-200 rounded-full h-1.5 overflow-hidden">
                                                                    <div 
                                                                        className={`h-1.5 rounded-full ${progressPercent === 100 ? 'bg-emerald-500' : 'bg-red-600'}`} 
                                                                        style={{ width: `${progressPercent}%` }}
                                                                    ></div>
                                                                </div>
                                                            </div>
                                                        </td>
                                                        <td className="px-4 py-3">
                                                            <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold ${
                                                                v.status === 'Concluído' ? 'bg-emerald-100 text-emerald-800' :
                                                                v.status === 'Em Andamento' ? 'bg-amber-100 text-amber-800' :
                                                                'bg-slate-100 text-slate-800'
                                                            }`}>
                                                                {v.status}
                                                            </span>
                                                        </td>
                                                        <td className="px-4 py-3 text-right">
                                                            <button
                                                                onClick={() => {
                                                                    setSelectedVehicle(v);
                                                                    setActiveTab('detalhes');
                                                                    setIsModalOpen(true);
                                                                }}
                                                                className="inline-flex items-center px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium rounded-md transition"
                                                            >
                                                                <i data-lucide="edit" className="w-3.5 h-3.5 mr-1"></i> Abrir
                                                            </button>
                                                        </td>
                                                    </tr>
                                                );
                                            })
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </main>

                    {/* MODAL DE GERENCIAMENTO DE PROCESSO */}
                    {isModalOpen && (
                        <ModalVehicleProcess
                            vehicle={selectedVehicle}
                            onClose={() => {
                                setIsModalOpen(false);
                                setSelectedVehicle(null);
                            }}
                            onSave={handleSaveVehicle}
                            onDelete={handleDeleteVehicle}
                            activeTab={activeTab}
                            setActiveTab={setActiveTab}
                        />
                    )}
                </div>
            );
        }

        // --- COMPONENTE MODAL DE EDIÇÃO E GERENCIAMENTO ---
        function ModalVehicleProcess({ vehicle, onClose, onSave, onDelete, activeTab, setActiveTab }) {
            const [formData, setFormData] = useState(() => {
                if (vehicle) return { ...vehicle };
                return {
                    placa: '',
                    modelo: '',
                    ano: '',
                    cliente: '',
                    cpfCnpj: '',
                    telefone: '',
                    loja: 'Vila Velha',
                    tipo: 'Entrada',
                    status: 'Pendente',
                    dataInicio: new Date().toISOString().slice(0, 10),
                    observacoes: '',
                    checklist: createInitialChecklist('Entrada'),
                    arquivos: []
                };
            });

            // Atualiza campos de texto do formulário
            const handleChange = (e) => {
                const { name, value } = e.target;
                
                // Se alterar a Fase (tipo), adapta os itens do checklist mantendo o histórico onde aplicável
                if (name === 'tipo' && value !== formData.tipo) {
                    const currentChecklist = formData.checklist || {};
                    const newSteps = CHECKLIST_STEPS[value] || CHECKLIST_STEPS.Entrada;
                    const newChecklist = {};
                    newSteps.forEach(step => {
                        newChecklist[step.id] = currentChecklist[step.id] || { checked: false, data: '' };
                    });
                    setFormData(prev => ({ ...prev, tipo: value, checklist: newChecklist }));
                } else {
                    setFormData(prev => ({ ...prev, [name]: value }));
                }
            };

            // Atualiza itens do Checklist
            const handleChecklistChange = (key, field, value) => {
                setFormData(prev => ({
                    ...prev,
                    checklist: {
                        ...prev.checklist,
                        [key]: {
                            ...(prev.checklist ? prev.checklist[key] : {}),
                            [field]: value,
                            ...(field === 'checked' && value && (!prev.checklist || !prev.checklist[key] || !prev.checklist[key].data) ? { data: new Date().toISOString().slice(0, 10) } : {})
                        }
                    }
                }));
            };

            // Processa upload de arquivo para Base64/DataURL
            const handleFileUpload = (e) => {
                const files = Array.from(e.target.files);
                if (!files.length) return;

                files.forEach(file => {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const newFileObj = {
                            id: `file-${Date.now()}-${Math.random().toString(36).substr(2, 4)}`,
                            nome: file.name,
                            tipo: file.type,
                            tamanho: (file.size / (1024 * 1024)).toFixed(2) + ' MB',
                            dataUpload: new Date().toLocaleString('pt-BR'),
                            dataUrl: event.target.result
                        };

                        setFormData(prev => ({
                            ...prev,
                            arquivos: [newFileObj, ...(prev.arquivos || [])]
                        }));
                    };
                    reader.readAsDataURL(file);
                });
            };

            // Remover Arquivo do Processo
            const handleRemoveFile = (fileId) => {
                setFormData(prev => ({
                    ...prev,
                    arquivos: prev.arquivos.filter(f => f.id !== fileId)
                }));
            };

            // Recarregar Lucide Icons após render do React
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            const currentSteps = CHECKLIST_STEPS[formData.tipo] || CHECKLIST_STEPS.Entrada;

            return (
                <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">

                        {/* Modal Header */}
                        <div className="px-6 py-4 bg-slate-900 text-white flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                                <span className="bg-red-600 text-white text-xs font-bold px-2.5 py-1 rounded uppercase tracking-wider">
                                    {formData.tipo}
                                </span>
                                <h2 className="text-lg font-bold">
                                    {formData.placa ? `${formData.placa.toUpperCase()} - ${formData.modelo}` : 'Novo Processo de Transferência'}
                                </h2>
                            </div>
                            <button onClick={onClose} className="text-slate-400 hover:text-white transition">
                                <i data-lucide="x" className="w-5 h-5"></i>
                            </button>
                        </div>

                        {/* Modal Tabs */}
                        <div className="flex border-b border-slate-200 bg-slate-50 px-6">
                            <button
                                onClick={() => setActiveTab('detalhes')}
                                className={`py-3 px-4 text-sm font-semibold border-b-2 flex items-center space-x-2 transition ${
                                    activeTab === 'detalhes' 
                                        ? 'border-red-600 text-red-600 bg-white' 
                                        : 'border-transparent text-slate-500 hover:text-slate-700'
                                }`}
                            >
                                <i data-lucide="info" className="w-4 h-4"></i>
                                <span>Dados Principais</span>
                            </button>

                            <button
                                onClick={() => setActiveTab('checklist')}
                                className={`py-3 px-4 text-sm font-semibold border-b-2 flex items-center space-x-2 transition ${
                                    activeTab === 'checklist' 
                                        ? 'border-red-600 text-red-600 bg-white' 
                                        : 'border-transparent text-slate-500 hover:text-slate-700'
                                }`}
                            >
                                <i data-lucide="check-square" className="w-4 h-4"></i>
                                <span>Checklist do Processo</span>
                            </button>

                            <button
                                onClick={() => setActiveTab('arquivos')}
                                className={`py-3 px-4 text-sm font-semibold border-b-2 flex items-center space-x-2 transition ${
                                    activeTab === 'arquivos' 
                                        ? 'border-red-600 text-red-600 bg-white' 
                                        : 'border-transparent text-slate-500 hover:text-slate-700'
                                }`}
                            >
                                <i data-lucide="paperclip" className="w-4 h-4"></i>
                                <span>Documentos e Arquivos ({formData.arquivos ? formData.arquivos.length : 0})</span>
                            </button>
                        </div>

                        {/* Modal Body */}
                        <div className="p-6 overflow-y-auto flex-1 space-y-6">
                            
                            {/* ABA 1: DETALHES PRINCIPAIS */}
                            {activeTab === 'detalhes' && (
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Placa *</label>
                                        <input
                                            type="text"
                                            name="placa"
                                            required
                                            placeholder="Ex: ABC1D23"
                                            value={formData.placa}
                                            onChange={(e) => setFormData(prev => ({ ...prev, placa: e.target.value.toUpperCase() }))}
                                            className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm font-mono uppercase focus:ring-2 focus:ring-red-500 focus:outline-none"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Modelo do Veículo *</label>
                                        <input
                                            type="text"
                                            name="modelo"
                                            required
                                            placeholder="Ex: Corolla 2.0 XEi"
                                            value={formData.modelo}
                                            onChange={handleChange}
                                            className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-red-500 focus:outline-none"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Ano / Fab</label>
                                        <input
                                            type="text"
                                            name="ano"
                                            placeholder="Ex: 2021/2022"
                                            value={formData.ano}
                                            onChange={handleChange}
                                            className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-red-500 focus:outline-none"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Loja WRA *</label>
                                        <select
                                            name="loja"
                                            value={formData.loja}
                                            onChange={handleChange}
                                            className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-red-500 focus:outline-none"
                                        >
                                            <option value="Vila Velha">Vila Velha</option>
                                            <option value="Cariacica">Cariacica</option>
                                        </select>
                                    </div>

                                    <div className="md:col-span-2 border-t border-slate-200 pt-4 mt-2">
                                        <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Dados do Cliente</h3>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Nome do Cliente *</label>
                                        <input
                                            type="text"
                                            name="cliente"
                                            required
                                            placeholder="Nome completo"
                                            value={formData.cliente}
                                            onChange={handleChange}
                                            className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-red-500 focus:outline-none"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">CPF / CNPJ</label>
                                        <input
                                            type="text"
                                            name="cpfCnpj"
                                            placeholder="000.000.000-00"
                                            value={formData.cpfCnpj}
                                            onChange={handleChange}
                                            className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-red-500 focus:outline-none"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Telefone / WhatsApp</label>
                                        <input
                                            type="text"
                                            name="telefone"
                                            placeholder="(27) 99999-9999"
                                            value={formData.telefone}
                                            onChange={handleChange}
                                            className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-red-500 focus:outline-none"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Fase da Operação</label>
                                        <select
                                            name="tipo"
                                            value={formData.tipo}
                                            onChange={handleChange}
                                            className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-red-500 focus:outline-none"
                                        >
                                            <option value="Entrada">📥 Entrada (Compra / Recebimento)</option>
                                            <option value="Saida">📤 Saída (Venda / Transferência)</option>
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Status Geral</label>
                                        <select
                                            name="status"
                                            value={formData.status}
                                            onChange={handleChange}
                                            className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-red-500 focus:outline-none"
                                        >
                                            <option value="Pendente">Pendente</option>
                                            <option value="Em Andamento">Em Andamento</option>
                                            <option value="Concluído">Concluído</option>
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Data Início</label>
                                        <input
                                            type="date"
                                            name="dataInicio"
                                            value={formData.dataInicio}
                                            onChange={handleChange}
                                            className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-red-500 focus:outline-none"
                                        />
                                    </div>

                                    <div className="md:col-span-2">
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Observações Internas</label>
                                        <textarea
                                            name="observacoes"
                                            rows="3"
                                            placeholder="Anotações e detalhes adicionais sobre o processo..."
                                            value={formData.observacoes}
                                            onChange={handleChange}
                                            className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-red-500 focus:outline-none"
                                        ></textarea>
                                    </div>
                                </div>
                            )}

                            {/* ABA 2: CHECKLIST ATUALIZADO */}
                            {activeTab === 'checklist' && (
                                <div className="space-y-4">
                                    <div className="bg-amber-50 border border-amber-200 text-amber-800 p-3 rounded-lg text-xs flex items-center justify-between">
                                        <div className="flex items-center space-x-2">
                                            <i data-lucide="info" className="w-4 h-4 text-amber-600 flex-shrink-0"></i>
                                            <span>Etapas do processo de <strong>{formData.tipo}</strong>:</span>
                                        </div>
                                        <span className="font-bold uppercase tracking-wider text-[10px] bg-amber-200 px-2 py-0.5 rounded text-amber-900">
                                            {formData.tipo}
                                        </span>
                                    </div>

                                    <div className="divide-y divide-slate-200 bg-white border border-slate-200 rounded-lg overflow-hidden">
                                        {currentSteps.map((step) => {
                                            const stepData = (formData.checklist && formData.checklist[step.id]) || { checked: false, data: '' };
                                            return (
                                                <div key={step.id} className="p-3.5 flex items-center justify-between hover:bg-slate-50 transition">
                                                    <div className="flex items-center space-x-3">
                                                        <input
                                                            type="checkbox"
                                                            id={step.id}
                                                            checked={stepData.checked}
                                                            onChange={(e) => handleChecklistChange(step.id, 'checked', e.target.checked)}
                                                            className="w-5 h-5 text-red-600 rounded border-slate-300 focus:ring-red-500 cursor-pointer"
                                                        />
                                                        <label htmlFor={step.id} className="font-medium text-slate-800 text-sm cursor-pointer">
                                                            {step.label}
                                                        </label>
                                                    </div>
                                                    <div className="flex items-center space-x-2">
                                                        <span className="text-xs text-slate-500">Data:</span>
                                                        <input
                                                            type="date"
                                                            value={stepData.data || ''}
                                                            onChange={(e) => handleChecklistChange(step.id, 'data', e.target.value)}
                                                            className="px-2 py-1 border border-slate-300 rounded text-xs bg-white focus:outline-none"
                                                        />
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}

                            {/* ABA 3: ARQUIVOS & UPLOAD BASE64 */}
                            {activeTab === 'arquivos' && (
                                <div className="space-y-4">
                                    {/* Area de Drop/Upload */}
                                    <div className="border-2 border-dashed border-slate-300 rounded-xl p-6 text-center hover:border-red-500 transition bg-slate-50">
                                        <i data-lucide="upload-cloud" className="w-10 h-10 text-slate-400 mx-auto mb-2"></i>
                                        <p className="text-sm font-semibold text-slate-700">Clique para enviar ou arraste arquivos aqui</p>
                                        <p className="text-xs text-slate-500 mt-1">Suporta arquivos PDF, Imagens (PNG, JPG) convertidos automaticamente para DataURL</p>
                                        <label className="mt-4 inline-flex items-center px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold rounded-lg shadow-sm cursor-pointer transition">
                                            Selecionar Arquivos
                                            <input
                                                type="file"
                                                multiple
                                                accept="image/*,application/pdf"
                                                onChange={handleFileUpload}
                                                className="hidden"
                                            />
                                        </label>
                                    </div>

                                    {/* Lista de Arquivos Anexados */}
                                    <div className="space-y-2">
                                        <h4 className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">
                                            Arquivos Anexados ({formData.arquivos ? formData.arquivos.length : 0})
                                        </h4>

                                        {(!formData.arquivos || formData.arquivos.length === 0) ? (
                                            <p className="text-xs text-slate-400 py-4 text-center border border-dashed rounded-lg">
                                                Nenhum arquivo anexado a este processo.
                                            </p>
                                        ) : (
                                            formData.arquivos.map((file) => (
                                                <div key={file.id} className="flex items-center justify-between p-3 bg-white border border-slate-200 rounded-lg hover:shadow-sm transition">
                                                    <div className="flex items-center space-x-3 overflow-hidden">
                                                        <div className="p-2 bg-slate-100 rounded text-slate-600 flex-shrink-0">
                                                            <i data-lucide={file.tipo.includes('pdf') ? 'file-text' : 'image'} className="w-5 h-5"></i>
                                                        </div>
                                                        <div className="truncate">
                                                            <p className="text-sm font-semibold text-slate-800 truncate">{file.nome}</p>
                                                            <p className="text-xs text-slate-400">{file.tamanho} • Upload em {file.dataUpload}</p>
                                                        </div>
                                                    </div>

                                                    <div className="flex items-center space-x-2 flex-shrink-0">
                                                        <a
                                                            href={file.dataUrl}
                                                            download={file.nome}
                                                            target="_blank"
                                                            rel="noopener noreferrer"
                                                            className="p-1.5 text-slate-600 hover:text-blue-600 hover:bg-blue-50 rounded transition"
                                                            title="Baixar / Visualizar Arquivo"
                                                        >
                                                            <i data-lucide="download" className="w-4 h-4"></i>
                                                        </a>

                                                        <button
                                                            type="button"
                                                            onClick={() => handleRemoveFile(file.id)}
                                                            className="p-1.5 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded transition"
                                                            title="Remover Arquivo"
                                                        >
                                                            <i data-lucide="trash-2" className="w-4 h-4"></i>
                                                        </button>
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            )}

                        </div>

                        {/* Modal Footer */}
                        <div className="px-6 py-4 bg-slate-50 border-t border-slate-200 flex items-center justify-between">
                            {formData.id ? (
                                <button
                                    type="button"
                                    onClick={() => onDelete(formData.id)}
                                    className="px-3 py-2 bg-red-50 text-red-600 hover:bg-red-100 rounded-lg text-xs font-semibold transition flex items-center space-x-1"
                                >
                                    <i data-lucide="trash" className="w-4 h-4"></i>
                                    <span>Excluir Processo</span>
                                </button>
                            ) : <div></div>}

                            <div className="flex items-center space-x-3">
                                <button
                                    type="button"
                                    onClick={onClose}
                                    className="px-4 py-2 border border-slate-300 hover:bg-slate-100 rounded-lg text-xs font-semibold text-slate-700 transition"
                                >
                                    Cancelar
                                </button>
                                <button
                                    type="button"
                                    onClick={() => onSave(formData)}
                                    className="px-5 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg text-xs font-bold transition shadow-sm"
                                >
                                    Salvar Alterações
                                </button>
                            </div>
                        </div>

                    </div>
                </div>
            );
        }

        // Renderiza a Aplicação
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
